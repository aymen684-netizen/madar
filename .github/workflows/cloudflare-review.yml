name: Verify Cloudflare production
on:
  workflow_dispatch:
  push:
    branches: [verification/cloudflare-production]
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: node scripts/check-cloudflare.mjs
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-browser.cjs
        env:
          MADAR_TEST_URL: https://madar.aymen684.workers.dev/
          MADAR_BROWSER_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloudflare-production-review
          path: test-results/
