name: Probe docx 9.14 without changing shipped vendor bytes

on:
  pull_request:
    paths:
      - scripts/probe-docx-9-14.mjs
      - .github/workflows/docx-9-14-probe.yml

permissions:
  contents: read

jobs:
  docx-umd-probe:
    if: github.head_ref == 'test/docx-9-14-umd-compat-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install locked application tooling without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Confirm probe source is Prettier-formatted
        run: npx prettier --check scripts/probe-docx-9-14.mjs
      - name: Reconstruct existing pinned vendor files for a clean baseline
        run: npm run build:source
      - name: Check official 9.14.0 npm integrity and UMD/browser compatibility
        run: node scripts/probe-docx-9-14.mjs
      - name: Validate real bilingual full and brief Word generators
        run: node scripts/check-report-quality.mjs
      - name: Verify local download and share behavior
        run: node scripts/check-word-delivery.mjs
      - name: Validate 1,001-row inventory Word/ZIP package
        run: node --max-old-space-size=512 scripts/check-inventory-word.mjs
      - name: Validate bilingual 1,001-row observer Word/ZIP and cancellation
        run: node --max-old-space-size=512 scripts/check-observer-word.mjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docx-9-14-isolated-umd-results
          path: test-results/docx-9-14-probe.json
          if-no-files-found: warn

  stress-word:
    if: github.head_ref == 'test/docx-9-14-umd-compat-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        rows: [5000, 10000, 20000]
    env:
      MADAR_WORD_STRESS_ROWS: ${{ matrix.rows }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build:source
      - name: Compare bounded Word generators using the same runner
        shell: bash
        run: |
          mkdir -p test-results
          set +e
          /usr/bin/time -v node --max-old-space-size=512 scripts/check-observer-word.mjs > "test-results/docx-baseline-${MADAR_WORD_STRESS_ROWS}.log" 2>&1
          baseline=$?
          node scripts/probe-docx-9-14.mjs > "test-results/docx-probe-${MADAR_WORD_STRESS_ROWS}.log" 2>&1
          setup=$?
          candidate=99
          if [ "$setup" -eq 0 ]; then
            /usr/bin/time -v node --max-old-space-size=512 scripts/check-observer-word.mjs > "test-results/docx-candidate-${MADAR_WORD_STRESS_ROWS}.log" 2>&1
            candidate=$?
          fi
          echo "Rows: $MADAR_WORD_STRESS_ROWS; baseline=$baseline; probe=$setup; candidate=$candidate"
          echo 'BASELINE (last 30 lines)'
          tail -n 30 "test-results/docx-baseline-${MADAR_WORD_STRESS_ROWS}.log"
          echo 'CANDIDATE (last 30 lines, if available)'
          if [ -f "test-results/docx-candidate-${MADAR_WORD_STRESS_ROWS}.log" ]; then
            tail -n 30 "test-results/docx-candidate-${MADAR_WORD_STRESS_ROWS}.log"
          else
            tail -n 25 "test-results/docx-probe-${MADAR_WORD_STRESS_ROWS}.log"
          fi
          if [ "$baseline" -ne 0 ] || [ "$setup" -ne 0 ] || [ "$candidate" -ne 0 ]; then
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docx-9-14-stress-${{ matrix.rows }}
          path: |
            test-results/docx-*.log
            test-results/docx-9-14-probe.json
          if-no-files-found: warn

  candidate-browser:
    if: github.head_ref == 'test/docx-9-14-umd-compat-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        suite: [interface, reports]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Build and validate original frozen release before local substitution
        run: |
          npm run build
          node scripts/verify-release.mjs --fixtures
      - name: Verify candidate tarball and stage only into ephemeral browser assets
        run: |
          node scripts/probe-docx-9-14.mjs
          cp public/vendor/docx.js build/release/assets/vendor/docx.js
          node --input-type=module -e "import fs from 'node:fs'; import crypto from 'node:crypto'; const sha=crypto.createHash('sha256').update(fs.readFileSync('build/release/assets/vendor/docx.js')).digest('hex'); if(sha!=='2024b090d888c4d0396d3088ae72b841de1e69e8a5bd8373e34ea31413d9dfdf') throw Error('Wrong candidate bytes');"
      - run: npx playwright install chromium
      - name: Test candidate Word inside actual browser and Worker flows
        run: node scripts/check-browser.cjs
        env:
          MADAR_TEST_ROOT: build/release/assets
          MADAR_BROWSER_SUITE: ${{ matrix.suite }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docx-9-14-browser-${{ matrix.suite }}
          path: test-results/
          if-no-files-found: warn

  profile-docx:
    if: github.head_ref == 'test/docx-9-14-umd-compat-20261102'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Display canonical profiler formatting for review
        run: |
          echo 'MADAR_PROFILE_FORMAT_BEGIN'
          npx prettier scripts/profile-docx-build.mjs
          echo 'MADAR_PROFILE_FORMAT_END'
      - run: npm run build:source
      - name: Preserve baseline UMD from locked shipped assets
        run: |
          mkdir -p test-results
          cp public/vendor/docx.js test-results/docx-baseline-9-5.umd.js
      - name: Prepare pinned npm candidate without changing release assets
        run: node scripts/probe-docx-9-14.mjs
      - name: Profile baseline in its own process
        run: node --max-old-space-size=512 scripts/profile-docx-build.mjs test-results/docx-baseline-9-5.umd.js 9.5.1 test-results/docx-profile-9-5.json
      - name: Profile candidate in its own process
        run: node --max-old-space-size=512 scripts/profile-docx-build.mjs public/vendor/docx.js 9.14.0 test-results/docx-profile-9-14.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docx-9-14-stage-profile
          path: test-results/docx-profile-*.json
          if-no-files-found: warn
