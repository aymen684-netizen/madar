name: Temporary format post-deploy scripts

on:
  pull_request:
    paths:
      - '.github/workflows/format-artifact-temporary.yml'
      - 'scripts/post-deploy-review.mjs'
      - 'scripts/check-post-deploy-review.mjs'

jobs:
  format:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/post-deploy-verified-smoke-issue-89'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-deploy-verified-smoke-issue-89
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx prettier --write scripts/post-deploy-review.mjs scripts/check-post-deploy-review.mjs
      - name: Commit formatting only on test branch
        run: |
          if ! git diff --quiet -- scripts/post-deploy-review.mjs scripts/check-post-deploy-review.mjs; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/post-deploy-review.mjs scripts/check-post-deploy-review.mjs
            git commit -m 'style: format post-deploy verification scripts'
            git push origin HEAD:refs/heads/fix/post-deploy-verified-smoke-issue-89
          fi
