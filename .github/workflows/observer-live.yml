name: Verify live observing report
on:
  push:
    branches: [verification/observer-live]
permissions:
  contents: read
jobs:
  live-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run: node scripts/check-browser-observer-live.cjs
        env:
          MADAR_TEST_URL: https://madar.aymen684.workers.dev/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-observer-review
          path: test-results/observer-live/
