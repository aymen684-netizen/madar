name: Review application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run check
      - run: npx playwright install chromium
      - run: node scripts/check-browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-review
          path: test-results/

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npx playwright install chromium
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: performance-baseline
      - name: Prepare baseline assets
        if: github.event_name == 'pull_request'
        working-directory: performance-baseline
        run: node scripts/prepare-security.mjs && node scripts/prepare-assets.mjs && node scripts/prepare-mission-profiles.mjs
      - name: Measure baseline under the same lab conditions
        if: github.event_name == 'pull_request'
        run: node scripts/measure-browser-performance.cjs
        env:
          MADAR_PERF_ROOT: performance-baseline/public
          MADAR_PERF_OUTPUT: test-results/performance-baseline.json
      - name: Measure candidate and assert stable detail nodes
        run: node scripts/measure-browser-performance.cjs
        env:
          MADAR_PERF_STABLE: '1'
          MADAR_PERF_OUTPUT: test-results/performance-candidate.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-review
          path: test-results/performance-*.json
