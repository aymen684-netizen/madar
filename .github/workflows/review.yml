name: Review application
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/check-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: test-results/
