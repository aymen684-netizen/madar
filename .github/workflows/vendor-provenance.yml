name: Verify upstream vendor bundle identity

on:
  pull_request:
    paths:
      - '.github/workflows/vendor-provenance.yml'
      - 'scripts/compare-vendor-upstream.mjs'
      - 'tools/vendor-audit/**'
      - 'packed/**'
      - 'public/vendor/**'

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix tools/vendor-audit --ignore-scripts
      - run: npm run build:source
      - run: node scripts/compare-vendor-upstream.mjs
